name: Build Android APK

on: 
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Install dependencies
        run: |
          npm ci
          npm install -g expo-cli
          
      - name: Clean and Prebuild
        run: |
          rm -rf android
          npx expo prebuild --platform android
          
      - name: Make gradlew executable
        run: chmod +x android/gradlew
        
      # Build avec capture d'erreur
      - name: Build APK
        id: build
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
        continue-on-error: true
        
      # Afficher les erreurs si build échoue
      - name: Show errors if failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "=== BUILD FAILED ==="
          cd android
          # Chercher les erreurs dans les logs
          grep -n "error:\|FAILURE:\|Exception\|Could not find\|Task.*failed" build.log | head -30 || true
          # Afficher les 50 dernières lignes
          echo "=== LAST 50 LINES ==="
          tail -50 build.log
          
      # Vérifier si l'APK existe
      - name: Check APK exists
        id: check_apk
        run: |
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "APK_FOUND=true" >> $GITHUB_OUTPUT
            ls -lh android/app/build/outputs/apk/release/
          else
            echo "APK_FOUND=false" >> $GITHUB_OUTPUT
            echo "=== APK NOT FOUND ==="
            ls -la android/app/build/outputs/apk/release/ 2>/dev/null || echo "Directory does not exist"
          fi
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: steps.check_apk.outputs.APK_FOUND == 'true'
        with:
          name: TCAS5M-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          
      - name: Upload logs on failure
        uses: actions/upload-artifact@v4
        if: steps.check_apk.outputs.APK_FOUND == 'false'
        with:
          name: build-logs
          path: android/build.log