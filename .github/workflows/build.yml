name: Build Android APK

on: 
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Install dependencies
        run: |
          npm ci
          npm install -g expo-cli
          
      - name: Clean and Prebuild
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean
          
      - name: Make gradlew executable
        run: chmod +x android/gradlew
        
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          
      - name: Find and rename APK
        run: |
          # Chercher tous les APK
          echo "=== Searching for APK files ==="
          find android -name "*.apk" -type f 2>/dev/null | head -20
          
          # Créer le dossier de sortie si inexistant
          mkdir -p android/app/build/outputs/apk/release
          
          # Chercher l'APK dans différents emplacements possibles
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "Found: app-release.apk"
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "Found: app-release-unsigned.apk, copying..."
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/app-release.apk
          else
            # Chercher n'importe quel APK release
            APK_PATH=$(find android -path "*/release/*.apk" -type f | head -1)
            if [ -n "$APK_PATH" ]; then
              echo "Found APK at: $APK_PATH"
              cp "$APK_PATH" android/app/build/outputs/apk/release/app-release.apk
            else
              echo "No APK found!"
              exit 1
            fi
          fi
          
          # Vérifier
          ls -lh android/app/build/outputs/apk/release/
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TCAS5M-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error