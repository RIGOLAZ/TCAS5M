name: Build Android APK

on: 
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Install dependencies
        run: |
          npm install
          npm install -g expo-cli
          
      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install
        
      - name: Make gradlew executable
        run: chmod +x android/gradlew
        
      # Build avec plus de logs pour voir l'erreur
      - name: Build APK (with logs)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace --info 2>&1 | tee build.log
        continue-on-error: true
        
      - name: Show error logs
        if: failure()
        run: |
          cd android
          cat build.log | grep -i "error\|fail\|exception" | head -50
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TCAS5M-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          
      - name: Upload logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: android/build.log