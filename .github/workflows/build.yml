name: Build Android APK

on: 
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386
          
      - name: Setup Node 20  # ← CHANGÉ : Node 20 au lieu de 18
        uses: actions/setup-node@v4
        with:
          node-version: 20  # ← CHANGÉ : 20 au lieu de 18
          
      - name: Install dependencies
        run: |
          npm ci
          npm install -g expo-cli
          
      - name: Clean and Prebuild
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean
          
      - name: Make gradlew executable
        run: chmod +x android/gradlew
        
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          
      - name: Find and upload APK
        run: |
          find android -name "*.apk" -type f | head -5
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/TCAS5M.apk || \
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk output/TCAS5M.apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TCAS5M-APK
          path: output/TCAS5M.apk